name: Build Hermes Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Hermes Agent release tag (e.g. v0.23.3). Leave empty for latest."
        required: false
        default: ""
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          TAG="$REQUESTED_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL https://api.github.com/repos/NousResearch/hermes-agent/releases/latest | jq -er '.tag_name')
          fi
          git check-ref-format "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          
          # Check if we should build (manual trigger or new tag)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            # Check last built tag from releases
            LAST_BUILT=$(curl -fsSL https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name // empty' | sed 's/^desktop-//')
            if [ "$TAG" = "$LAST_BUILT" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "Already built $TAG, skipping."
            else
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          
          echo "Building from tag: $TAG"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Resolve JavaScript toolchain
        id: toolchain
        shell: bash
        run: |
          NODE_VERSION=22
          if [ -f pm/lock.json ]; then
            NODE_VERSION=$(jq -er '.packages.node.version' pm/lock.json)
          fi
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

          if [ -f pnpm-lock.yaml ]; then
            PNPM_VERSION=$(jq -er '.packages.pnpm.version' pm/lock.json)
            echo "pnpm_version=$PNPM_VERSION" >> "$GITHUB_OUTPUT"
            echo "package_manager=pnpm" >> "$GITHUB_OUTPUT"
          else
            echo "package_manager=npm" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node_version }}

      - name: Install dependencies
        shell: bash
        env:
          PNPM_VERSION: ${{ steps.toolchain.outputs.pnpm_version }}
        run: |
          if [ -n "$PNPM_VERSION" ]; then
            npm install --global "pnpm@$PNPM_VERSION"
            pnpm install --frozen-lockfile --filter . --filter 'hermes...' --ignore-scripts
          else
            npm ci --ignore-scripts
          fi

      - uses: actions/setup-python@v6
        if: matrix.platform == 'mac' && steps.toolchain.outputs.package_manager == 'pnpm'
        id: python
        with:
          python-version: '3.12'

      - name: Install Linux native build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libx11-dev libxi-dev

      - name: Build Desktop (dist)
        shell: bash
        working-directory: apps/desktop
        env:
          PACKAGE_MANAGER: ${{ steps.toolchain.outputs.package_manager }}
          PLATFORM: ${{ matrix.platform }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
          HERMES_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          # The desktop build embeds the upstream commit in the installer.
          export GITHUB_SHA="$(git rev-parse HEAD)"
          export GITHUB_REF_NAME="$UPSTREAM_TAG"

          BUILDER_ARGS=()
          DESKTOP_VERSION=$(jq -er '.version' package.json)
          if [ "$DESKTOP_VERSION" = 0.0.0 ]; then
            # Newer upstream tags use a placeholder until packaging assigns a version.
            VERSION="${UPSTREAM_TAG#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ || "$VERSION" = 0.0.0 ]]; then
              echo "::error::Cannot derive a desktop version from tag $UPSTREAM_TAG"
              exit 1
            fi
            export HERMES_PAYLOAD_VERSION="$VERSION"
            BUILDER_ARGS+=("-c.extraMetadata.version=$VERSION")
          fi
          if [ "$PLATFORM" = linux ]; then
            BUILDER_ARGS+=(--linux AppImage)
          elif [ "$PLATFORM" = win ] && jq -e '.scripts | has("dist:win:msix")' package.json > /dev/null; then
            BUILDER_ARGS+=(--win msix zip)
          fi

          "$PACKAGE_MANAGER" run build
          if [ "$PACKAGE_MANAGER" = npm ] && [ "${#BUILDER_ARGS[@]}" -gt 0 ]; then
            BUILDER_ARGS=(-- "${BUILDER_ARGS[@]}")
          fi
          "$PACKAGE_MANAGER" run builder "${BUILDER_ARGS[@]}"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.msix
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: hermes-desktop-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ needs.resolve.outputs.tag }}
          name: "Hermes Desktop — ${{ needs.resolve.outputs.tag }}"
          draft: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-scoop:
    needs: [resolve, publish]
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      (needs.publish.result == 'success' || needs.resolve.outputs.should_build == 'false')
    permissions:
      contents: write
    uses: ./.github/workflows/update-scoop.yml
